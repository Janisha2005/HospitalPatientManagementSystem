# H2 In-Memory Database Configuration for Maven Tests
spring.datasource.url=jdbc:h2:mem:hospital_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Security JWT for Testing
app.jwt.secret=HospitalManagementSystemSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm!
app.jwt.expiration-ms=3600000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174
